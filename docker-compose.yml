services:
  db:
    image: postgres:15
    container_name: pouca-carne-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pouca-carne-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delivery?schema=public
      PORT: 3333
      JWT_SECRET: dev-secret-troque-em-producao
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx ts-node src/server.ts"
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # o código vem do host; node_modules fica o da imagem (client do prisma, bcrypt compilado)
      - .:/app
      - /app/node_modules

  web:
    build: ../Pouca-carne
    container_name: pouca-carne-web
    restart: unless-stopped
    command: npx vite --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ../Pouca-carne:/app
      - /app/node_modules

volumes:
  pgdata:
